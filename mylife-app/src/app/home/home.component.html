<div class="home">
  <header class="home__header">
    <p class="greeting">{{ greeting }} ✦</p>
    <p class="date">{{ today | date:'EEEE, d MMMM y' }}</p>
  </header>

  <div class="home__grid">
    @for (card of cards; track card.route) {
      <a class="workspace-card" [routerLink]="card.route">
        <span class="workspace-card__icon">{{ card.icon }}</span>
        <span class="workspace-card__title">{{ card.title }}</span>
        <span class="workspace-card__subtitle">{{ card.subtitle }}</span>
      </a>
    }
  </div>

  <footer class="home__footer">
    <p class="home__note">
      Everything is stored in this browser only. Back up before clearing site
      data, or to move your history to another device.
    </p>
    <div class="home__actions">
      <button class="home__action" (click)="download()" [disabled]="busy">
        Download backup
      </button>
      <label class="home__action">
        Restore
        <input type="file" accept="application/json,.json"
               (change)="restore($event)" hidden />
      </label>
    </div>
  </footer>
</div>
