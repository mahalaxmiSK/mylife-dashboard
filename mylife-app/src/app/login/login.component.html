<div class="login">
  <h1 class="login__title">MyLife</h1>

  <ng-container *ngIf="!sent">
    <p class="login__lead">Sign in with a link sent to your email.</p>

    <form class="login__form" (ngSubmit)="send()">
      <label class="visually-hidden" for="login-email">Email address</label>
      <input class="input" id="login-email" type="email" name="email"
             [(ngModel)]="email" autocomplete="email" inputmode="email"
             placeholder="your@email.com" [disabled]="sending" />
      <button class="btn btn--primary" type="submit" [disabled]="sending || !email.trim()">
        {{ sending ? 'Sending...' : 'Send link' }}
      </button>
    </form>

    <p class="login__error" role="alert" *ngIf="error">{{ error }}</p>
    <p class="login__note">No password. The link signs you in and lasts an hour.</p>
  </ng-container>

  <ng-container *ngIf="sent">
    <p class="login__sent">Check your email.</p>
    <p class="login__note">
      The link opens this dashboard. It works once, and expires after an hour.
    </p>
    <button class="btn btn--ghost" (click)="sent = false">Use a different address</button>
  </ng-container>
</div>
