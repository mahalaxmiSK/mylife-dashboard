<div class="login">
  <h1 class="login__title">MyLife</h1>
  <p class="login__lead">Type your passphrase.</p>

  <form class="login__form" (ngSubmit)="signIn()">
    <label class="visually-hidden" for="login-passphrase">Passphrase</label>
    <input class="input login__passphrase" id="login-passphrase" type="password"
           name="passphrase" [(ngModel)]="passphrase"
           autocomplete="current-password" autocapitalize="none"
           autocorrect="off" spellcheck="false"
           placeholder="four words" [disabled]="busy" />
    <button class="btn btn--primary" type="submit"
            [disabled]="busy || !passphrase.trim()">
      {{ busy ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>

  <p class="login__error" role="alert" *ngIf="error">{{ error }}</p>

  <p class="login__note">
    No email, no code to wait for. Once you are in, this device stays signed in
    and you will not be asked again.
  </p>
</div>
