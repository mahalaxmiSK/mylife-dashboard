<div class="page">
  <a class="page__back" routerLink="/">&larr; back</a>
  <h1 class="page__title">EQ Check-in</h1>

  <span class="label">How are you feeling?</span>
  <div class="chip-row">
    <button class="chip" *ngFor="let emotion of emotions"
            [class.chip--active]="selected === emotion"
            (click)="select(emotion)">{{ emotion }}</button>
  </div>

  <ng-container *ngIf="selected">
    <div class="add-row">
      <input class="input" [(ngModel)]="note" (keyup.enter)="save()"
             placeholder="Anything you want to note (optional)" />
      <button class="btn btn--primary" (click)="save()" [disabled]="saving">Save</button>
    </div>

    <div class="suggestions" *ngIf="suggestions.length">
      <span class="label">Might help</span>
      <div class="list-item" *ngFor="let suggestion of suggestions">
        <span class="list-item__text">{{ suggestion.activity_text }}</span>
      </div>
    </div>
  </ng-container>

  <h2 class="section-title">Recent</h2>
  <p class="loading" *ngIf="loading">Loading...</p>
  <div class="list" *ngIf="!loading">
    <div class="list-item" *ngFor="let checkin of history">
      <span class="list-item__text">
        <strong>{{ checkin.emotion }}</strong>
        <em class="note" *ngIf="noteText(checkin)"> - {{ noteText(checkin) }}</em>
      </span>
      <span class="stamp">{{ checkin.created_at | date: 'MMM d' }}</span>
    </div>
    <p class="empty" *ngIf="!history.length">No check-ins yet.</p>
  </div>
</div>
