name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mylife-app/package-lock.json

      - name: Install dependencies
        working-directory: mylife-app
        run: npm ci

      - name: Build
        working-directory: mylife-app
        run: npm run build -- --configuration production

      # Pages serves 404.html for unknown paths. Hash routing makes this a
      # safety net only, but it stops a stray link showing GitHub's own 404.
      - name: Add SPA fallback
        run: cp mylife-app/dist/mylife-app/browser/index.html mylife-app/dist/mylife-app/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mylife-app/dist/mylife-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
